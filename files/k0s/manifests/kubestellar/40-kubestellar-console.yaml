apiVersion: v1
kind: Namespace
metadata:
  name: kubestellar-console
---
apiVersion: v1
kind: Service
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
  labels:
    app.kubernetes.io/name: kubestellar-console
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: kubestellar-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
  labels:
    app.kubernetes.io/name: kubestellar-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubestellar-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubestellar-console
    spec:
      containers:
      - name: console
        # v0.3.34, pinned by digest for supply-chain integrity (same pattern
        # as the kiosk proxy's nginx image in 41-kubestellar-kiosk-proxy.yaml).
        image: ghcr.io/kubestellar/console@sha256:f27adaf8d097a5403f60041615525497e0970151fcd10b90b7b6e903b395be32
        env:
        - name: DEV_MODE
          value: "true"
        - name: ALLOW_DEV_MODE_IN_CLUSTER
          value: "true"
        - name: DEV_USER_LOGIN
          value: "admin"
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: client-id
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: client-secret
              optional: true
        # When unset, the server itself generates a random secret because
        # DEV_MODE=true above: pkg/api/server.go calls loadOrCreateDevSecret,
        # which persists it as .jwt-secret under os.UserConfigDir() inside
        # the container (survives a plain container restart, lost on pod
        # recreation since no volume is mounted here). Without DEV_MODE an
        # unset JWT_SECRET is a fatal exit, not a weak default, so removing
        # DEV_MODE requires setting jwt-secret in the Secret. Verified
        # against the pinned v0.3.34 tag (the image entrypoint is
        # entrypoint.sh, not start.sh):
        # https://github.com/kubestellar/console/blob/v0.3.34/pkg/api/server.go#L78-L89
        # https://github.com/kubestellar/console/blob/v0.3.34/pkg/api/startup.go#L350-L388
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: jwt-secret
              optional: true
        ports:
        - containerPort: 8080
          name: http
